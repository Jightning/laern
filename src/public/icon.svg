<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Learn">
  <!-- The mark: a mortarboard, from SVG Repo, recoloured to the app's own
       palette. The ground is the accent at its default rotation
       (oklch(62% .132 233) = #0092c8, the same blue the library wears) and the
       glyph is white, because at 16px in a browser tab the only thing that
       survives is contrast mass.

       Geometry is not decoration here. The art is 320px wide inside a 512
       canvas, which puts every corner of its bounding box inside the 409px
       circle Android crops adaptive icons to — so one file can serve as both
       the plain and the maskable icon without being clipped. tools/gen-icons.mjs
       renders every other size from this file; nothing else is hand-drawn. -->
  <rect width="512" height="512" fill="#0092c8"/>
  <g transform="translate(79.6 83.4) scale(11.0307)">
