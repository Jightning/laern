term: Tier
body: |-
  <p>Every block declares one of three: <b>spine</b> (definition, rule, mechanism, one canonical instance; removing it breaks the argument), <b>depth</b> (why and what-if; nothing examinable), <b>apply</b> (another instance; teaches nothing new).</p>
  <p>The lane selector shows spine, spine+apply, or all. A collapsed tier renders as a stub with a count in text, so a skipped run is visible rather than an invisible hole.</p>
src: Defined in §1.4
review: true
