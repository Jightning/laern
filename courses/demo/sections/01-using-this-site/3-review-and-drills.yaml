title: Review and drills
blocks:
  - t: p
    source: docs/architecture.md §3c
    h: |-
      Quizzes ask whether you can produce an answer today. Review asks whether you still can in six weeks, and it is the half of the site that decides what you see rather than waiting for you to choose. The <b>Review</b> button in the toolbar carries the count of what is due across every course you have installed, and <code>r</code> opens it.

  - t: def
    source: docs/architecture.md §3c
    term: Drill
    label: What review serves you
    h: |-
      <p>A short retrieval item attached to a concept, not to a subsection. A concept's drill bank holds several, so the same idea comes back wearing a different surface each time; the schedule decides when, and the criterion is three correct recalls on three <em>different</em> items, followed by three sessions on separate days.</p>

  - t: key
    source: src/lib/retention.js
    label: How a concept gets into review
    h: |-
      <p>Two doors, and reading is neither of them. Either you open a concept from <b>Core concepts</b> and press <b>Drill this</b>, or you miss a quiz question you were <c k="confidence">confident</c> about and the seam enrols it for the next day. An untouched course therefore has nothing due, and that is the system working, not an empty page.</p>

  - t: table
    cap: What each surface is for
    head: [Surface, Asks, Chooses items by]
    rows:
      - [Subsection quiz, Can I produce this now?, one per question type in that subsection]
      - [Mixed practice, Can I still do these mixed together?, your scope and count, drawn across the course]
      - [Review, Do I still hold this?, what the schedule says is due, across every course]

  - t: trap
    source: docs/architecture.md §3c
    label: Nothing due does not mean nothing to do
    h: |-
      <p>An empty review queue means no concept has reached its next scheduled date, often because none have been enrolled yet. Mixed practice is available at any time and draws from the quiz pool, so "nothing is due" is never a reason to close the tab.</p>

  - t: p
    tier: depth
    source: docs/architecture.md §3c
    h: |-
      The schedule is per concept and cross-course: one queue, not one per subject. It survives closing the tab, and it is rebuilt by replaying your answer log, which is also what lets two of your own devices merge their history without either losing a session.

  - t: ex
    tier: apply
    source: docs/architecture.md §3c
    title: A concept's first week
    h: |-
      <ol>
        <li>Monday: you miss a confident question. The concept is enrolled and drilled once immediately.</li>
        <li>Tuesday: it is due. You recall it correctly. That is one distinct item down.</li>
        <li>Thursday, then the following week: two more items, two more days. The criterion is met, and the interval starts stretching.</li>
      </ol>

quiz:
  - type: Diagnose an empty queue
    concept: confidence
    q: |-
      A reader has read three sections and answered every quiz correctly. The review count says 0. Why?
    a: |-
      Nothing has been enrolled: they made no confident misses and drilled no concept by hand. Reading and answering correctly do not put a concept into the schedule.
    why: |-
      <p>Enrolment is deliberately narrow. If reading enrolled concepts, day one of any course would be a queue of everything in it, and the queue is the part that has to stay believable.</p>
    why_prompt: What are the only two things that enrol a concept?
    verified: 2026-09-06

  - type: Choose the right surface
    concept: tier
    q: |-
      You want twenty questions on one procedure, right now, before an exam tomorrow. Where do you go?
    a: |-
      Mixed practice, with the scope set to that section. Review only ever serves what is due today.
    why: |-
      <p>The two are not interchangeable: review protects the long interval that makes memory durable, so it will not hand you twenty items because you asked. Practice exists for exactly the case where you want volume now.</p>
    why_prompt: Why will review not simply give you more items when you ask for them?
    verified: 2026-09-06
