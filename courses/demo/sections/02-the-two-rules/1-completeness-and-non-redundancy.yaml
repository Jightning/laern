title: Completeness and non-redundancy
blocks:
  - t: p
    source: docs/material_truth.md §1
    h: |-
      You are reading a course whose only job is to show the system. It still obeys the system's two rules: nothing here leans on knowledge the calibration did not grant, and no explanation appears twice. This subsection states both rules; the rest of the course is what it takes to hold them together.

  - t: def
    source: docs/material_truth.md M2
    term: Completeness
    label: Rule 1
    h: |-
      <p>Assume no prior knowledge beyond the written calibration in <code>expectations.md</code>. Do not skip a step because it seems obvious. Obviousness is measured against the reader on record, not against the author.</p>

  - t: def
    source: docs/material_truth.md M1
    term: Non-redundancy
    label: Rule 2
    h: |-
      <p>Every piece of <em>explanation</em> appears exactly once. Two subsections that need one idea: one defines it, the other links. Three or more: it becomes a concept.</p>

  - t: key
    source: docs/material_truth.md §1
    label: Why they need each other
    h: |-
      <p><c k="completeness">Completeness</c> and <c k="non-redundancy">non-redundancy</c> pull in opposite directions. One wants every step written, the other wants nothing written twice. The reference system dissolves the conflict: a reader can always reach a definition from wherever they stand, so a course is complete <em>without</em> repeating itself.</p>

  - t: trap
    source: docs/material_truth.md M1
    label: A second application is not a second copy
    h: |-
      <p>Non-redundancy governs explanation, not practice. Deleting the drill bank's repeated worked instances "to avoid redundancy" removes exactly the repetition long-term retention needs. The rule forbids restating the <em>definition</em>, nothing else.</p>

  - t: p
    source: docs/architecture.md
    h: |-
      How the two rules survive contact with a real course, through links, concepts and tiers, is <a href="#s2-2">§2.2</a>.

  - t: note
    tier: depth
    source: docs/code_truth.md
    label: What the rules replaced
    h: |-
      <p>Before this, explanatory text was allowed to recur "for emphasis". Two copies of one idea drift out of agreement, and the reader cannot tell which is current. The single-source rule is the fix, and the reference system is what makes it survivable.</p>

quiz:
  - type: Classify a rule violation
    concept: non-redundancy
    q: |-
      A course explains the Wronskian in full in §3.2, then explains it again in full in §5.1 because "readers may have forgotten". Which rule is broken, and what is the fix?
    a: |-
      Non-redundancy. §5.1 should link to §3.2 (or the idea should be promoted to a concept, since it is now used in several places).
    why: |-
      <p>The second full explanation is a second copy that will drift. A link renders a margin card, feeds the prerequisite list, and draws a dependency edge. One action, several benefits, no duplication.</p>
    why_prompt: What does the reader lose when the two copies eventually disagree?
    verified: 2026-09-02

  - type: Identify which rule applies
    concept: completeness
    q: |-
      An author omits the definition of "integrating factor" because "any engineering student knows it". The calibration lists only Calc I–III. Which rule is at stake?
    a: |-
      Completeness. The step is only omittable if the calibration says the reader already has it, and this one does not.
    why: |-
      <p>Completeness is measured against the written record, not the author's sense of the median student. If the reader on record needs the step, it is not obvious. It is missing.</p>
    why_prompt: Against whom is "obvious" measured?
    verified: 2026-09-02

  - type: Spot the error
    concept: non-redundancy
    q: |-
      A reviewer flags a drill bank for "repeating the same procedure five times" and asks the author to cut it to one. Is the reviewer right?
    a: |-
      No. The drill bank is required to repeat applications, and that repetition is the retention loop. Non-redundancy forbids repeating the <em>explanation</em>, which the drills do not do.
    why: |-
      <p>The tempting reading is that any repetition is waste. The rule is narrower: one copy of the words that teach the idea. Repeated practice on the idea is a different reader activity, and cutting it removes the only thing that makes the concept stick past the week.</p>
    why_prompt: Which kind of repetition does Rule 2 actually prohibit?
    verified: 2026-09-02
