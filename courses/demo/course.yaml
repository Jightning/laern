code: DEMO 001
title: The Study-Site System
tagline: |-
  Start here. §1 is everything you need to read, answer, and review a course; the rest is why it works that way, and every block, figure, and loop the engine can render.
meta: This repository · self-referential

theme:
  hue: 265
state:
  enabled: true

# The audit ceilings this course has reached (npm run audit). Absent means 1,
# meaning report only; these are locked at what the content pass achieved, so
# the course cannot regress. `unsourced` is not 0 because the demo deliberately
# ships one `unverified` and one `generated` block to show both badges.
audit:
  unsourced: 0.15
  unverified: 0
  unprompted: 0
  unrouted: 0.3

# Cell values coloured in mono tables, keyed to classes defined in `styles`.
valueStyles:
  yes: v-y
  no: v-n
  auto: v-a

# Extra CSS for this course, injected at load. Ink variants for text (T3).
styles: |
  .v-y{color:var(--hi-ink);font-weight:700}
  .v-n{color:var(--lo-ink)}
  .v-a{color:var(--dc-ink);font-style:italic}
  .metric{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;margin:0 0 var(--sp-2)}
  .metric-v{font-family:var(--mono);font-size:1.3rem;font-weight:700;color:var(--hi-ink)}
  .metric-l{font-size:.8rem;color:var(--ink-2)}

# Syntax highlighting for `code` blocks — pure configuration, no renderer.
syntax:
  comment: "#"
  keywords: [tier, spine, depth, apply, concept, review, quiz, drill]
  strings: true
  patterns:
    - {re: "§\\d+(\\.\\d+)?", cls: tok-n}
