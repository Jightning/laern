title: First Topic
blurb: What this section covers and why it comes at this point in the course.

# One or two prequestions about a *relation* the section is about to establish,
# not about a term — the primer's own run already covers terms. They run before
# the section opens, and the correction is not optional: an uncorrected
# conceptual pretest error is more likely to be repeated later than one never
# asked. Ask about what you actually want retained; the benefit does not
# generalise to the rest of the section.
primer:
  - ask: A question about how two things in this section relate.
    answer: The short correct answer.
    why: |-
      <p>Why it is that and not the tempting alternative.</p>
